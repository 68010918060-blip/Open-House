<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="https://thumb.wikimedia.org/wikipedia/th/thumb/d/d9/Mahasarakham_Business_School_Logo.svg/960px-Mahasarakham_Business_School_Logo.svg.png?utm_source=th.wikipedia.org&utm_campaign=imageinfo&utm_content=thumbnail">
<title>Open House Quiz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap">
<style>
  /* Layout: one screen at a time. Board of 20 numbers; picking one opens that single question; answering ends the turn. */
  :root {
    --bg: #FFFFFF;
    --tint: #F2F5FB;
    --surface: #FFFFFF;
    --ink: #0A2A66;
    --muted: #55678C;
    --line: #D3DCEF;
    --accent: #0A2A66;
    --accent-ink: #FFFFFF;
    --gold: #FFC72C;
    --gold-ink: #0A2A66;
    --star-blue: #8DAEEA;
    --star-soft: #FFE08A;
    --ok: #14805E;
    --ok-bg: #E5F5EF;
    --bad: #B4233A;
    --bad-bg: #FCEBED;
    --font-display: "Prompt", "Noto Sans Thai", system-ui, sans-serif;
    --font-body: "Noto Sans Thai", system-ui, sans-serif;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.6;
    padding-block: 24px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

  header { display: flex; flex-direction: column; align-items: center; gap: 12px; border-bottom: 4px solid var(--gold); padding-bottom: 16px; }
  .logo { flex: none; width: 128px; height: 128px; }
  @media (min-width: 640px) { .logo { width: 150px; height: 150px; } }
  /* question page: shrink the header to one compact row so the question stays on screen */
  body.compact header { flex-direction: row; justify-content: flex-start; gap: 12px; padding-bottom: 12px; }
  body.compact .logo { width: 56px; height: 56px; }
  .titles { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
  .dept { margin: 0; font: 700 clamp(18px, 5vw, 24px)/1.4 var(--font-display); color: var(--ink); text-align: center; text-wrap: balance; animation: fadeUp .5s ease backwards .3s; }
  body.compact .titles { align-items: flex-start; gap: 2px; }
  body.compact .dept { font-size: 15px; text-align: left; }
  .eyebrow { display: inline-block; background: var(--accent); color: var(--gold); letter-spacing: .06em; text-transform: uppercase; font-weight: 700; margin: 0; padding: 8px 20px; border-radius: 12px; }
  h1 { font-family: var(--font-display); font-size: clamp(18px, 4vw, 24px); line-height: 1.3; margin: 0; text-wrap: balance; }

  .prompt { font-family: var(--font-display); font-size: clamp(18px, 3.4vw, 22px); font-weight: 500; margin: 0 0 14px; color: var(--muted); }

  .picker { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (min-width: 640px) { .picker { grid-template-columns: repeat(5, 1fr); gap: 14px; } }
  .num {
    font: 700 30px/1 var(--font-display);
    font-variant-numeric: tabular-nums;
    aspect-ratio: 1 / 0.8;
    border-radius: 16px;
    border: 2px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    transition: transform .12s ease, border-color .12s ease, background-color .12s ease;
  }
  .num:hover { border-color: var(--gold); background: var(--gold); color: var(--gold-ink); transform: translateY(-3px) scale(1.05); }
  .num:active { transform: scale(.95); }

  .card { background: var(--surface); border: 1px solid var(--line); border-top: 5px solid var(--gold); border-radius: 16px; padding: 24px 20px; display: flex; flex-direction: column; gap: 18px; }
  @media (min-width: 640px) { .card { padding: 28px; } }
  .badge { align-self: flex-start; font: 700 18px/1 var(--font-display); background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 8px 18px; font-variant-numeric: tabular-nums; }
  .qtext { font-family: var(--font-display); font-size: clamp(20px, 3.6vw, 26px); font-weight: 600; line-height: 1.4; margin: 0; text-wrap: balance; min-width: 0; overflow-wrap: anywhere; }

  .options { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
  .opt {
    width: 100%;
    display: flex; align-items: center; gap: 14px;
    text-align: left;
    font: 500 17px/1.4 var(--font-body);
    color: var(--ink);
    background: var(--tint);
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    min-height: 56px;
    cursor: pointer;
    transition: border-color .12s ease, background-color .12s ease;
  }
  .opt:hover:not(:disabled) { border-color: var(--gold); background: #FFF8DF; }
  .opt:disabled { cursor: default; }
  .letter {
    flex: none; width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center;
    font: 600 16px/1 var(--font-display);
    background: var(--surface); border: 1.5px solid var(--line); color: var(--muted);
  }
  .otext { min-width: 0; overflow-wrap: anywhere; }
  .opt.ok { background: var(--ok-bg); border-color: var(--ok); }
  .opt.ok .letter { background: var(--ok); border-color: var(--ok); color: var(--surface); }
  .opt.bad { background: var(--bad-bg); border-color: var(--bad); }
  .opt.bad .letter { background: var(--bad); border-color: var(--bad); color: var(--surface); }
  .opt.dim { opacity: .55; }

  .feedback { margin: 0; font-weight: 600; font-size: 18px; }
  .feedback.ok { color: var(--ok); }
  .feedback.bad { color: var(--bad); }

  .nav { display: flex; justify-content: flex-end; gap: 12px; flex-wrap: wrap; }
  .btn {
    font: 600 16px/1 var(--font-body);
    padding: 14px 22px; border-radius: 12px; cursor: pointer;
    border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  }
  .btn:hover { border-color: var(--gold); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { border-color: var(--gold); box-shadow: 0 3px 0 var(--gold); }
  .btn.primary:hover { filter: brightness(1.06); }

  /* ---- cute motion ---- */
  @keyframes pop { 0% { transform: scale(.5); opacity: 0; } 60% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes bump { 0% { transform: scale(.97); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
  @keyframes fadeUp { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes cardIn { from { transform: translateY(24px) scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes wave { 0%, 55%, 100% { transform: translateY(0); } 25% { transform: translateY(-5px); } }
  @keyframes float { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-7px) rotate(2deg); } }
  @keyframes point { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(5px); } }
  @keyframes tada { 0% { transform: scale(.7); opacity: 0; } 40% { transform: scale(1.12) rotate(-3deg); opacity: 1; } 60% { transform: scale(1.05) rotate(3deg); } 80% { transform: scale(1.08) rotate(-2deg); } 100% { transform: scale(1) rotate(0); } }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
  @keyframes fall { from { transform: translate(0, 0) rotate(0); opacity: 1; } to { transform: translate(var(--x), 108vh) rotate(var(--r)); opacity: .9; } }

  .ch { display: inline-block; white-space: pre; }
  body:not(.compact) .ch { animation: wave 2.8s ease-in-out infinite; animation-delay: calc(var(--i) * 90ms); }
  body:not(.compact) .logo { animation: float 3.4s ease-in-out infinite; }
  .prompt { animation: fadeUp .5s ease backwards .15s; }
  .point { display: inline-block; animation: point 1s ease-in-out infinite; }
  .num { animation: pop .45s cubic-bezier(.34, 1.56, .64, 1) backwards; animation-delay: calc(var(--i) * 28ms + 150ms); }
  .card.fresh { animation: cardIn .4s ease backwards; }
  .card.fresh .qtext { animation: fadeUp .45s ease backwards .12s; }
  .card.fresh .options li { animation: fadeUp .4s ease backwards; animation-delay: calc(var(--i) * 80ms + 220ms); }
  .opt.ok { animation: bump .45s ease; }
  .opt.bad { animation: shake .45s ease; }
  .feedback.ok { animation: tada .8s ease backwards; }
  .feedback.bad { animation: shake .5s ease backwards .1s; }
  .confetti { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 50; }
  .confetti span { position: absolute; top: -40px; animation: fall 2.4s ease-in forwards; }

  /* twinkling stars behind everything (cards stay opaque so text is never covered) */
  @keyframes twinkle {
    0%, 100% { opacity: .2; transform: translateY(0) scale(.7) rotate(0deg); }
    50% { opacity: .8; transform: translateY(-8px) scale(1.1) rotate(18deg); }
  }
  .stars { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  .st { position: absolute; opacity: .45; animation: twinkle 3s ease-in-out infinite; }
  .st.star { clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
  .st.spark { clip-path: polygon(50% 0%, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0% 50%, 38% 38%); }
  .st.gold { background: var(--gold); }
  .st.blue { background: var(--star-blue); }
  .st.soft { background: var(--star-soft); }

  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  body { margin: 0; }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="https://thumb.wikimedia.org/wikipedia/th/thumb/d/d9/Mahasarakham_Business_School_Logo.svg/960px-Mahasarakham_Business_School_Logo.svg.png?utm_source=th.wikipedia.org&utm_campaign=imageinfo&utm_content=thumbnail" alt="Logo">
    <div class="titles">
      <h1 class="eyebrow">DBIS OPENHOUSE QUIZ</h1>
      <p class="dept">สาขา ธุรกิจดิจิทัลและระบบสารสนเทศ</p>
    </div>
  </header>

  <main id="main" aria-live="polite"></main>
</div>

<script>
  // a = index (0-3) of the correct choice. Edit this list to change the questions.
  var QUESTIONS = [
    { q: "อุปกรณ์ใดใช้พิมพ์เอกสารออกมาเป็นกระดาษ", c: ["เครื่องพิมพ์", "เมาส์", "ลำโพง", "คีย์บอร์ด"], a: 0 },
    { q: "จอภาพใช้ทำอะไร", c: ["ฟังเสียง", "แสดงภาพ", "พิมพ์งาน", "ชาร์จไฟ"], a: 1 },
    { q: "Wi-Fi ใช้ทำอะไร", c: ["ชาร์จมือถือ", "พิมพ์เอกสาร", "เล่นอินเทอร์เน็ตโดยไม่ต้องเสียบสาย", "ทำให้เครื่องเย็น"], a: 2 },
    { q: "แอปใดใช้ส่งข้อความหาเพื่อน", c: ["เครื่องคิดเลข", "นาฬิกา", "ไฟฉาย", "LINE"], a: 3 },
    { q: "แอปใดใช้ดูวิดีโอ", c: ["Word", "YouTube", "เครื่องคิดเลข", "ปฏิทิน"], a: 1 },
    { q: "ข้อใดคือเว็บที่ใช้ค้นหาข้อมูล", c: ["Google", "Word", "Excel", "Paint"], a: 0 },
    { q: "รหัสผ่านแบบไหนปลอดภัยกว่า", c: ["1234", "password", "Hs#7kq!82", "ชื่อเล่นของเรา"], a: 2 },
    { q: "เราควรบอกรหัสผ่านให้ใครรู้", c: ["เพื่อนสนิท", "ไม่บอกใครเลย", "คนที่ทักมาในแชต", "ทุกคนในห้อง"], a: 1 },
    { q: "มีคนแปลกหน้าทักมาขอรหัส OTP ควรทำอย่างไร", c: ["ไม่ให้ และบอกผู้ปกครองหรือครู", "ส่งให้เลย", "ถามชื่อก่อนแล้วส่งให้", "ส่งให้ครึ่งเดียว"], a: 0 },
    { q: "ก่อนกดลิงก์แปลก ๆ ควรทำอย่างไร", c: ["กดทันที", "ส่งต่อให้ทุกคน", "ตรวจสอบก่อนว่าปลอดภัยไหม", "กรอกข้อมูลส่วนตัวทั้งหมด"], a: 2 },
    { q: "ระบบลงทะเบียนเรียนออนไลน์ ช่วยให้เราทำอะไร", c: ["ทำอาหาร", "ซ่อมจักรยาน", "ปลูกผัก", "เลือกวิชาเรียนผ่านเว็บได้"], a: 3 },
    { q: "ที่เก็บข้อมูลจำนวนมากอย่างเป็นระเบียบ เรียกว่าอะไร", c: ["จอภาพ", "เมาส์", "ฐานข้อมูล", "ลำโพง"], a: 2 },
    { q: "ไฟล์ที่ลงท้ายด้วย .mp3 คือไฟล์อะไร", c: ["เสียงเพลง", "รูปภาพ", "เอกสาร", "วิดีโอ"], a: 0 },
    { q: "สัญลักษณ์ @ ใช้ในสิ่งใด", c: ["ชื่อเครื่องพิมพ์", "ที่อยู่อีเมล", "ราคาสินค้า", "รหัสไปรษณีย์"], a: 1 },
    { q: "AI คืออะไร", c: ["เครื่องซักผ้า", "ชนิดของสายชาร์จ", "เกมมือถือ", "ปัญญาประดิษฐ์ ที่ช่วยคิดและตอบคำถามได้"], a: 3 },
    { q: "สแกน QR Code ด้วยมือถือ เพื่อทำอะไร", c: ["ชาร์จแบต", "ล้างหน้าจอ", "เปิดเว็บไซต์หรือข้อมูลได้เร็ว", "เพิ่มเสียง"], a: 2 },
    { q: "ไฟล์งานสำคัญควรสำรองไว้ที่ไหนเพิ่มอีกที่", c: ["ไม่ต้องสำรอง", "Google Drive หรือแฟลชไดรฟ์", "ลบไฟล์เดิมทิ้ง", "ส่งให้คนแปลกหน้า"], a: 1 },
    { q: "ก่อนโพสต์ลงโซเชียล ควรทำอย่างไร", c: ["โพสต์เลยทันที", "ใส่เลขบัตรประชาชน", "ใส่ที่อยู่บ้านให้ชัด", "คิดก่อนว่าปลอดภัยและเหมาะสมไหม"], a: 3 },
    { q: "กด Ctrl + C คือสั่งอะไร", c: ["คัดลอก", "วาง", "ลบ", "บันทึก"], a: 0 },
    { q: "โปรแกรมใดเหมาะกับการพิมพ์รายงาน", c: ["YouTube", "LINE", "Microsoft Word", "เกมมือถือ"], a: 2 }
  ];
  var LETTERS = ["ก", "ข", "ค", "ง"];

  var current = null; // index of the number the player picked, null = showing the board
  var picked = null;  // index of the choice the player tapped, null = not answered yet
  var mainEl = document.getElementById("main");

  function renderBoard() {
    mainEl.innerHTML = '<p class="prompt">เลือกเลขคำถามที่น้องๆได้ <span class="point" aria-hidden="true">👇</span></p>' +
      '<nav class="picker" id="picker" aria-label="เลือกเลขข้อคำถาม"></nav>';
    var picker = document.getElementById("picker");
    QUESTIONS.forEach(function (item, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "num";
      b.style.setProperty("--i", i);
      b.textContent = i + 1;
      b.setAttribute("aria-label", "เลือกข้อ " + (i + 1));
      b.addEventListener("click", function () { current = i; picked = null; render(); });
      picker.appendChild(b);
    });
  }

  function renderQuestion() {
    var item = QUESTIONS[current];
    var done = picked !== null;

    mainEl.innerHTML = '<section class="card' + (done ? '' : ' fresh') + '">' +
      '<span class="badge">ข้อ ' + (current + 1) + '</span>' +
      '<h2 class="qtext"></h2><ul class="options"></ul>' +
      '<p class="feedback" id="feedback"></p>' +
      '<div class="nav" id="nav"></div></section>';
    mainEl.querySelector(".qtext").textContent = item.q;

    var list = mainEl.querySelector(".options");
    item.c.forEach(function (text, i) {
      var li = document.createElement("li");
      li.style.setProperty("--i", i);
      var b = document.createElement("button");
      b.type = "button";
      b.className = "opt";
      b.disabled = done;
      b.innerHTML = '<span class="letter"></span><span class="otext"></span>';
      b.querySelector(".letter").textContent = LETTERS[i];
      b.querySelector(".otext").textContent = text;
      if (done) {
        if (i === item.a) b.classList.add("ok");
        else if (i === picked) b.classList.add("bad");
        else b.classList.add("dim");
      }
      b.addEventListener("click", function () { choose(i); });
      li.appendChild(b);
      list.appendChild(li);
    });

    if (done) {
      var fb = document.getElementById("feedback");
      if (picked === item.a) {
        fb.className = "feedback ok";
        fb.textContent = "🎉ถูกต้องละค้าบ! เก่งมากๆ";
        burst();
      } else {
        fb.className = "feedback bad";
        fb.textContent = "😊ไม่ถูกนะค้าบ คำตอบที่ถูกคือข้อ " + LETTERS[item.a] + " " + item.c[item.a];
      }
    }

    var nav = document.getElementById("nav");
    var next = document.createElement("button");
    next.type = "button";
    next.className = "btn primary";
    next.textContent = "กลับหน้าแรก";
    next.addEventListener("click", function () { current = null; picked = null; render(); });
    nav.appendChild(next);
  }

  function render() {
    document.body.classList.toggle("compact", current !== null);
    if (current === null) renderBoard(); else renderQuestion();
    window.scrollTo({ top: 0 });
  }

  function choose(i) {
    if (current === null || picked !== null) return;
    picked = i;
    render();
  }

  var reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  // little emoji confetti when the answer is right
  function burst() {
    if (reduceMotion) return;
    var box = document.createElement("div");
    box.className = "confetti";
    box.setAttribute("aria-hidden", "true");
    var icons = ["🎉", "⭐", "✨", "💛", "💙"];
    for (var i = 0; i < 22; i++) {
      var s = document.createElement("span");
      s.textContent = icons[Math.floor(Math.random() * icons.length)];
      s.style.left = Math.random() * 100 + "%";
      s.style.fontSize = (16 + Math.random() * 16) + "px";
      s.style.setProperty("--x", (Math.random() * 120 - 60) + "px");
      s.style.setProperty("--r", (Math.random() * 540 - 270) + "deg");
      s.style.animationDuration = (1.8 + Math.random() * 1.4) + "s";
      s.style.animationDelay = (Math.random() * 0.5) + "s";
      box.appendChild(s);
    }
    document.body.appendChild(box);
    setTimeout(function () { box.remove(); }, 4200);
  }

  // split the English title into letters so they can wave one by one
  (function () {
    var h = document.querySelector(".eyebrow");
    var text = h.textContent;
    h.setAttribute("aria-label", text);
    h.textContent = "";
    for (var i = 0; i < text.length; i++) {
      var span = document.createElement("span");
      span.className = "ch";
      span.setAttribute("aria-hidden", "true");
      span.style.setProperty("--i", i);
      span.textContent = text.charAt(i);
      h.appendChild(span);
    }
  })();

  // let the branch name wave too, word by word, continuing the wave from the title
  // (Thai has no spaces, so the browser's word splitter finds the word breaks)
  (function () {
    var p = document.querySelector(".dept");
    if (!window.Intl || !Intl.Segmenter) return;
    var base = (document.querySelector(".eyebrow").getAttribute("aria-label") || "").length;
    var parts = Array.from(new Intl.Segmenter("th", { granularity: "word" }).segment(p.textContent));
    p.textContent = "";
    var n = 0;
    parts.forEach(function (part) {
      if (part.isWordLike) {
        var span = document.createElement("span");
        span.className = "ch";
        span.style.setProperty("--i", base + n * 2);
        span.textContent = part.segment;
        p.appendChild(span);
        n++;
      } else {
        p.appendChild(document.createTextNode(part.segment));
      }
    });
  })();

  // scatter twinkling stars in the background
  (function () {
    var box = document.createElement("div");
    box.className = "stars";
    box.setAttribute("aria-hidden", "true");
    var colors = ["gold", "blue", "soft"];
    for (var i = 0; i < 28; i++) {
      var st = document.createElement("span");
      var size = 10 + Math.random() * 12;
      st.className = "st " + (i % 3 === 0 ? "spark" : "star") + " " + colors[Math.floor(Math.random() * 3)];
      st.style.width = st.style.height = size + "px";
      st.style.left = Math.random() * 96 + "%";
      st.style.top = Math.random() * 96 + "%";
      st.style.animationDuration = (2.2 + Math.random() * 2.6) + "s";
      st.style.animationDelay = (-Math.random() * 5) + "s";
      box.appendChild(st);
    }
    document.body.insertBefore(box, document.body.firstChild);
  })();

  render();
</script>
</body>
</html>
